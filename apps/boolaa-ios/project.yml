name: Boolaa
options:
  bundleIdPrefix: ro.boolaa
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: W5WKF2N472
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.1.0"

targets:
  Boolaa:
    type: application
    platform: iOS
    sources:
      - path: Boolaa
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Boolaa/Resources/Boolaa.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Universal links for invite links https://boolaa.ro/join/<CODE> (AASA served by the web app).
        com.apple.developer.associated-domains: ["applinks:boolaa.ro"]
    info:
      path: Boolaa/Resources/Info.plist
      properties:
        CFBundleDisplayName: Boolaa
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro, fr, es, it]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        WebBaseURL: $(WEB_BASE_URL)
        # OAuth / email-link callback (ro.boolaa.app://auth/callback, PKCE) and Google Sign-In's
        # reversed iOS client ID. Client IDs are public identifiers (docs/oauth-clients.md).
        CFBundleURLTypes:
          - CFBundleURLName: ro.boolaa.app.auth
            CFBundleURLSchemes: [ro.boolaa.app]
          # Legacy invite-link fallback: boolaa://join/<CODE> (ro.boolaa.app://join/<CODE> works too).
          - CFBundleURLName: ro.boolaa.app.invite
            CFBundleURLSchemes: [boolaa]
          - CFBundleURLName: com.googleusercontent.apps.ios
            CFBundleURLSchemes: [com.googleusercontent.apps.816126337836-4111v58ciqce0gavcrcvuks2tj2c6un7]
        GIDClientID: 816126337836-4111v58ciqce0gavcrcvuks2tj2c6un7.apps.googleusercontent.com
        GIDServerClientID: 816126337836-0k4begddfi0f1usm1hg2e6va9fddni3m.apps.googleusercontent.com
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Boolaa uses your photos for avatars, food posts and marketplace items.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.boolaa.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  BoolaaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoolaaTests
    dependencies:
      - target: Boolaa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.boolaa.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Boolaa.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Boolaa
        BUNDLE_LOADER: $(TEST_HOST)

  BoolaaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BoolaaUITests
    dependencies:
      - target: Boolaa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.boolaa.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Boolaa

schemes:
  Boolaa:
    build:
      targets:
        Boolaa: all
        BoolaaTests: [test]
        BoolaaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BoolaaTests
        - BoolaaUITests
